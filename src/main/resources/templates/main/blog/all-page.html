<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Blogs</title>
    <link rel="stylesheet" href="/css/main/blog/home-page.css">
</head>
<body>
<img src="/images/logo.png" alt="Logo" class="logo">
<div class="container">
    <h1>All Posts</h1>

    <div th:if="${#lists.isEmpty(allBlogs)}" class="no-blog">
        <p>No posts yet. Check back soon!</p>
    </div>

    <div th:each="blog : ${allBlogs}" class="blog-post">
        <h2 th:text="${blog.title}"></h2>
        <p class="date" th:text="${#temporals.format(blog.createdAt, 'dd MMM yyyy HH:mm')}"></p>
        <div style="white-space: pre-line;">
            <p th:text="${blog.content}"></p>
        </div>
    </div>
</div>
<div class="buttons">
    <button th:onclick="|window.location.href='/main/'|">Back to Main</button>
</div>
</body>
</html>
